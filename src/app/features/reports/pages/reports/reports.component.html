<app-page-header title="Reports & Analytics">
</app-page-header>

@for (category of categories; track category) {
  <div class="category-section">
    <h3 class="category-title">{{ category }}</h3>
    <div class="reports-grid">
      @for (report of getByCategory(category); track report.title) {
        <div class="report-card">
          <div class="report-icon"><i [class]="report.icon"></i></div>
          <div class="report-info">
            <div class="report-title">{{ report.title }}</div>
            <div class="report-desc">{{ report.description }}</div>
          </div>
          <div class="report-actions">
            <p-button label="View" icon="pi pi-eye" size="small" severity="info" [text]="true"></p-button>
            <p-button label="Export" icon="pi pi-download" size="small" severity="secondary" [text]="true"></p-button>
          </div>
        </div>
      }
    </div>
  </div>
}
