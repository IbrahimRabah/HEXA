<app-page-header title="PAGES.AUDIT">
</app-page-header>

<div class="filters-bar">
  <p-iconfield>
    <p-inputicon styleClass="pi pi-search"></p-inputicon>
    <input pInputText [(ngModel)]="searchTerm" placeholder="Search user, action, module..." (input)="applyFilters()" />
  </p-iconfield>
</div>

<div class="card">
  <p-table [value]="filtered" [loading]="loading" [paginator]="true" [rows]="20" dataKey="id">
    <ng-template #header>
      <tr>
        <th pSortableColumn="timestamp">Timestamp <p-sortIcon field="timestamp"></p-sortIcon></th>
        <th pSortableColumn="userName">User <p-sortIcon field="userName"></p-sortIcon></th>
        <th pSortableColumn="action">Action <p-sortIcon field="action"></p-sortIcon></th>
        <th pSortableColumn="module">Module <p-sortIcon field="module"></p-sortIcon></th>
        <th>Description</th>
        <th>IP Address</th>
      </tr>
    </ng-template>
    <ng-template #body let-log>
      <tr>
        <td>{{ log.timestamp | date:'dd MMM yyyy HH:mm:ss' }}</td>
        <td><strong>{{ log.userName }}</strong></td>
        <td>
          <p-tag [value]="log.action" [severity]="getActionSeverity(log.action)"></p-tag>
        </td>
        <td>{{ log.module }}</td>
        <td>{{ log.description }}</td>
        <td><code>{{ log.ipAddress }}</code></td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--p-text-muted-color)">No audit logs found.</td></tr>
    </ng-template>
  </p-table>
</div>
