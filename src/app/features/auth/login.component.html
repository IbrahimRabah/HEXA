<div class="login-wrapper">
  <p-card header="Hexa Care Login" [style]="{ width: '400px' }">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field">
        <p-floatlabel>
          <input pInputText id="username" formControlName="username" class="w-full" />
          <label for="username">Username</label>
        </p-floatlabel>
      </div>
      <div class="field mt-4">
        <p-floatlabel>
          <p-password id="password" formControlName="password" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
          <label for="password">Password</label>
        </p-floatlabel>
      </div>
      <div class="mt-4">
        <p-button type="submit" label="Login" [disabled]="loginForm.invalid" class="w-full" styleClass="w-full"></p-button>
      </div>
    </form>
  </p-card>
</div>
