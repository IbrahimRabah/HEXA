<app-page-header title="PAGES.SETTINGS">
</app-page-header>

<p-tabs value="0">
  <p-tablist>
    <p-tab value="0">{{ 'SETTINGS.GENERAL' | translate }}</p-tab>
    <p-tab value="1">{{ 'SETTINGS.NOTIFICATIONS' | translate }}</p-tab>
    <p-tab value="2">{{ 'SETTINGS.SECURITY' | translate }}</p-tab>
  </p-tablist>
  <p-tabpanels>
    <p-tabpanel value="0">
      <div class="settings-section">
        <h3>{{ 'SETTINGS.HOSPITAL_INFO' | translate }}</h3>
        <div class="settings-grid">
          <div class="form-field"><label>{{ 'SETTINGS.HOSPITAL_NAME' | translate }}</label><input pInputText [(ngModel)]="settings.hospitalName" /></div>
          <div class="form-field"><label>{{ 'SETTINGS.LICENSE_NUMBER' | translate }}</label><input pInputText [(ngModel)]="settings.licenseNumber" /></div>
          <div class="form-field"><label>{{ 'COMMON.PHONE' | translate }}</label><input pInputText [(ngModel)]="settings.phone" /></div>
          <div class="form-field"><label>{{ 'COMMON.EMAIL' | translate }}</label><input pInputText [(ngModel)]="settings.email" /></div>
          <div class="form-field full-width"><label>{{ 'COMMON.ADDRESS' | translate }}</label><input pInputText [(ngModel)]="settings.address" /></div>
          <div class="form-field">
            <label>{{ 'SETTINGS.CURRENCY' | translate }}</label>
            <p-select [(ngModel)]="settings.currency" [options]="currencies" optionLabel="label" optionValue="value"></p-select>
          </div>
          <div class="form-field">
            <label>{{ 'SETTINGS.DATE_FORMAT' | translate }}</label>
            <p-select [(ngModel)]="settings.dateFormat" [options]="dateFormats" optionLabel="label" optionValue="value"></p-select>
          </div>
        </div>
        <div class="settings-actions">
          <p-button [label]="'SETTINGS.SAVE_CHANGES' | translate" icon="pi pi-save" (onClick)="save()"></p-button>
        </div>
      </div>
    </p-tabpanel>
    <p-tabpanel value="1">
      <div class="settings-section">
        <p class="placeholder-text">{{ 'SETTINGS.NOTIFICATIONS_COMING' | translate }}</p>
      </div>
    </p-tabpanel>
    <p-tabpanel value="2">
      <div class="settings-section">
        <p class="placeholder-text">{{ 'SETTINGS.SECURITY_COMING' | translate }}</p>
      </div>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
